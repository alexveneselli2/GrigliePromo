# Render Blueprint — single service that hosts BOTH the app and the AI proxy.
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo → Apply.
# Then open the service → Environment → set the ANTHROPIC_API_KEY secret.
# That's it: same origin for app + API, no CORS, no GitHub variable needed.
# Persistent Postgres for the flyer (volantino) cataloguing feature.
# Render's web-service disk is ephemeral, so uploads/analyses live here.
databases:
  - name: grigliepromo-db
    plan: free
    databaseName: grigliepromo
    user: grigliepromo

services:
  - type: web
    name: grigliepromo
    runtime: node
    plan: free
    # Install deps (incl. Vite devDeps), build the frontend with same-origin AI,
    # then install the server's own deps.
    buildCommand: npm install --include=dev && npm run build && npm install --prefix server
    startCommand: node server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Secret — paste your Anthropic API key here in the Render dashboard.
      # Never commit it. Without it the app still loads (heuristic engine only).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-opus-4-8
      # Model used to read uploaded flyer PDFs (vision + structured output).
      - key: VOLANTINO_MODEL
        value: claude-opus-5
      # Injected by Render from the database above — never hardcode it.
      - key: DATABASE_URL
        fromDatabase:
          name: grigliepromo-db
          property: connectionString
      # Build-time flag: makes the frontend call the AI on the same origin.
      - key: VITE_AI_SAME_ORIGIN
        value: "1"
      - key: NODE_VERSION
        value: "20"
