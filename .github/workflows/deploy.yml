name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/promotional-grid-demo-eVn42]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Where the AI proxy lives. Without this the Pages build has no proxy
          # and the "AI (Claude)" toggle stays disabled (heuristic engine only).
          # Defaults to the Render service; override in repo Settings →
          # Secrets and variables → Actions → Variables if you move the proxy.
          # The proxy allows this origin via ALLOWED_ORIGINS (see server/index.js).
          VITE_AI_PROXY_URL: ${{ vars.VITE_AI_PROXY_URL || 'https://grigliepromo.onrender.com' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
