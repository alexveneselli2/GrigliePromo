name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/promotional-grid-demo-eVn42]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set this in repo Settings → Secrets and variables → Actions → Variables.
          # e.g. https://grigliepromo-ai-proxy.onrender.com
          # If empty, the app falls back to the local heuristic engine.
          VITE_AI_PROXY_URL: ${{ vars.VITE_AI_PROXY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
